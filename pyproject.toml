[project]
name = "adl-api"
version = "0.1.0"
description = "Dictionary API for the ADL platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.122.0",
    "ipykernel>=7.1.0",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "pydash>=8.0.6",
    "pymongo>=4.15.4",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.38.0",
    "ruff>=0.14.6",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
fixable = ["ALL"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.params.Query"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
test = "pytest"
dev = "uv run fastapi dev"
convert = "python -m app.data_processing.convert"
insert-data = "python -m app.services.import_service"
process = "python -m app.transformers.lex_transformer"

[tool.poe.tasks.check]
sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
]
help = "Run all checks"
